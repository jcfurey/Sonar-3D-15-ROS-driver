sonar3d:
  autostart:
    type: bool
    default_value: false
    description: "Configure and activate the managed node as soon as it starts spinning. Leave false when a lifecycle manager drives the node."

  sonar_ip:
    type: string
    default_value: "192.168.194.96"
    description: "Literal IPv4 address used as the expected packet source and Sonar 3D-15 HTTP API address. Empty accepts packets from any source when configure_sonar is false."

  fallback_ip:
    type: string
    default_value: "192.168.194.96"
    description: "Additional literal IPv4 packet source to accept, by default the Sonar 3D-15 fixed fallback address. Some vehicles (for example Blueye) deliver sonar output from it even when sonar_ip is a DHCP address. Empty accepts sonar_ip only."

  frame_id:
    type: string
    default_value: "sonar3d_link"
    description: "REP-103 body frame used by range, bitmap, and point-cloud products."

  imu_frame_id:
    type: string
    default_value: "sonar3d_imu_link"
    description: "Frame at the internal IMU location; publish a static transform to frame_id using the documented sensor offset."

  configure_sonar:
    type: bool
    default_value: true
    description: "On configure, enable acoustics, UDP multicast and (with publish_imu) ImuBatch output through the device HTTP API."

  speed_of_sound:
    type: double
    default_value: -1.0
    description: "Speed of sound to configure in m/s. Negative keeps the device setting; zero selects the sonar's automatic calculation from salinity and water temperature; otherwise 1000-2000 m/s."
    validation:
      bounds<>: [-1.0, 2000.0]

  salinity:
    type: string
    default_value: ""
    description: "Water salinity for the automatic speed of sound: fresh or salt (sonar release 1.7.0+). Empty keeps the device setting."
    validation:
      one_of<>: [["", "fresh", "salt"]]

  acoustics_mode:
    type: string
    default_value: ""
    description: "low-frequency (5 Hz, 90 x 40 degrees) or high-frequency (20 Hz, 40 x 40 degrees), sonar release 1.7.0+. Empty keeps the device setting."
    validation:
      one_of<>: [["", "low-frequency", "high-frequency"]]

  range_min:
    type: double
    default_value: 0.0
    description: "Minimum imaging range in metres, applied with range_max."
    validation:
      bounds<>: [0.0, 100.0]

  range_max:
    type: double
    default_value: 0.0
    description: "Maximum imaging range in metres. Zero keeps the device range; otherwise it must exceed range_min."
    validation:
      bounds<>: [0.0, 100.0]

  ntp_server:
    type: string
    default_value: ""
    description: "NTP server address, or auto, for the sonar clock (sonar release 1.7.1+). Empty keeps the device setting. The setting persists on the sonar."

  ntp_sync_timeout:
    type: double
    default_value: 0.0
    description: "When positive, force an NTP sync during configuration and wait up to this many seconds for it."
    validation:
      bounds<>: [0.0, 60.0]

  http_port:
    type: int
    default_value: 80
    description: "TCP port of the sonar HTTP API."
    validation:
      bounds<>: [1, 65535]

  device_status_period:
    type: double
    default_value: 5.0
    description: "Seconds between reads of the sonar's status, temperature and time over HTTP while configured; reported as the Device diagnostic. Zero disables polling."
    validation:
      bounds<>: [0.0, 3600.0]

  http_timeout:
    type: double
    default_value: 5.0
    description: "HTTP connect and request timeout in seconds. Speed-of-sound updates are allowed at least 30 seconds."
    validation:
      bounds<>: [0.1, 60.0]

  udp_mode:
    type: string
    default_value: "multicast"
    description: "multicast receives the sonar's multicast group; unicast receives datagrams addressed to interface_address and, with configure_sonar, points the sonar's output there."
    validation:
      one_of<>: [["multicast", "unicast"]]

  multicast_group:
    type: string
    default_value: "224.0.0.96"
    description: "IPv4 multicast group carrying RIP packets in multicast mode."

  udp_port:
    type: int
    default_value: 4747
    description: "UDP port carrying RIP packets."
    validation:
      bounds<>: [1, 65535]

  interface_address:
    type: string
    default_value: "0.0.0.0"
    description: "Local IPv4 address. Multicast: the interface that joins the group. Unicast: the address the socket binds and, with configure_sonar, where the sonar sends; it must then be this computer's address on the sonar network."

  udp_receive_buffer_size:
    type: int
    default_value: 1048576
    description: "Requested UDP socket receive buffer in bytes. Zero keeps the OS default; the OS may clamp or adjust this value. Diagnostics report the actual socket value."
    validation:
      bounds<>: [0, 67108864]

  use_sensor_timestamps:
    type: bool
    default_value: true
    description: "Use valid protobuf timestamps; otherwise stamp products from the ROS clock on receipt."

  max_sensor_clock_offset:
    type: double
    default_value: 1.0
    description: "Largest accepted difference in seconds between a sensor timestamp and ROS receive time. The sonar clock starts at an arbitrary time and stays there until NTP succeeds; beyond this offset, sensor timestamps are shifted onto ROS time by one offset shared by all products (the minimum observed receive delay), keeping the sonar's own spacing between images and IMU samples. Zero trusts sensor timestamps unconditionally."
    validation:
      bounds<>: [0.0, 3600.0]

  publish_tf:
    type: bool
    default_value: true
    description: "Broadcast the documented static transform from frame_id to imu_frame_id on /tf_static."

  point_cloud_intensity:
    type: bool
    default_value: true
    description: "Add an intensity field with linear signal strength from the same shot's signal-strength image to the point cloud."

  publish_point_cloud:
    type: bool
    default_value: true
    description: "Publish dense valid returns as sensor_msgs/PointCloud2."

  publish_range_image:
    type: bool
    default_value: true
    description: "Publish scaled range pixels as a 32FC1 sensor_msgs/Image."

  publish_bitmap_images:
    type: bool
    default_value: true
    description: "Publish signal-strength and shaded bitmap messages on their respective mono8 topics."

  publish_imu:
    type: bool
    default_value: true
    description: "Publish ImuBatch samples on imu/data_raw. With configure_sonar, also enables the sonar's ImuBatch output (sonar release 1.8.0 or newer)."

  linear_acceleration_stddev:
    type: double
    default_value: 0.0
    description: "REP-145 accelerometer noise standard deviation in m/s^2, used for the linear_acceleration_covariance diagonal. Zero reports the covariance as unknown."
    validation:
      bounds<>: [0.0, 100.0]

  angular_velocity_stddev:
    type: double
    default_value: 0.0
    description: "REP-145 gyroscope noise standard deviation in rad/s, used for the angular_velocity_covariance diagonal. Zero reports the covariance as unknown."
    validation:
      bounds<>: [0.0, 10.0]

  packet_stale_timeout:
    type: double
    default_value: 2.0
    description: "Age in seconds after which an active RIP stream is diagnosed as stale."
    validation:
      bounds<>: [0.1, 60.0]
