sonar3d_driver:
  ros__parameters:
    sonar_ip: "192.168.194.96"
    frame_id: "sonar3d_link"
    imu_frame_id: "sonar3d_imu_link"
    configure_sonar: true
    speed_of_sound: 0.0
    http_timeout: 5.0
    multicast_group: "224.0.0.96"
